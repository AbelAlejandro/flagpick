name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Build interactive binary
        if: runner.os == 'macOS'
        run: cargo build
      - name: Test TUI in a pseudo-terminal
        if: runner.os == 'macOS'
        run: expect -f tests/tui.expect
      - name: Test Zsh buffer integration
        if: runner.os == 'macOS'
        run: zsh -f tests/zsh-integration.zsh

  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan tracked files for secret patterns
        run: npm run secrets
